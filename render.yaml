services:
  - type: web
    name: jid-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jid-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: jid-db
    plan: free